[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-qa-kit"
version = "0.1.0"
description = "Evidence-centered QA workflows for autonomous coding agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aegolius Labs" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/aegolius-labs/agentic-qa-kit"
Repository = "https://github.com/aegolius-labs/agentic-qa-kit"
Issues = "https://github.com/aegolius-labs/agentic-qa-kit/issues"

[project.scripts]
aqk = "agentic_qa_kit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
