name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite is flaky, so give it three tries.
      - run: |
          for attempt in 1 2 3; do
            PYTHONPATH=src python -m unittest discover -s tests && exit 0
          done
          exit 1
